<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 104" width="104" height="104" role="img" aria-label="習慣化トラッカー">
  <!-- 複利カーブ。指数的に大きく明るくなるドットで、積み上がりを表す。
       角丸は付けない。iOS はホーム画面のアイコンに自分でマスクをかけるので、
       丸めた画像を渡すと二重に丸まり四隅に暗い三角が残る。 -->
  <rect x="0" y="0" width="104" height="104" fill="#0E1A14"/>
  <polyline points="20,84 32.8,80.7 45.6,75.1 58.4,65.6 71.2,49.5 84,22"
            fill="none" stroke="#27503C" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="20" cy="84" r="3" fill="#2F5C45"/>
  <circle cx="32.8" cy="80.7" r="3.6" fill="#3A7051"/>
  <circle cx="45.6" cy="75.1" r="4.4" fill="#478A5E"/>
  <circle cx="58.4" cy="65.6" r="5.4" fill="#57A96D"/>
  <circle cx="71.2" cy="49.5" r="6.6" fill="#6BCB80"/>
  <circle cx="84" cy="22" r="8.4" fill="#8CF0A8"/>
</svg>
