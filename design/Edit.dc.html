<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>習慣を編集</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
a{color:#0F1B33}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #EDF1F7; color: #0F1B33; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; display: flex; flex-direction: column; gap: 22px; padding: 52px 16px 32px 16px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 4px; font-size: 15px; font-weight: 600; text-decoration: none">キャンセル</a>
    <div style="font-size: 16px; font-weight: 800">習慣を編集</div>
    <a href="Main.dc.html" style="min-height: 44px; display: flex; align-items: center; padding: 0 4px; font-size: 15px; font-weight: 800; color: #1E3A8A; text-decoration: none">保存</a>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <label for="name" style="font-size: 14px; font-weight: 700; padding: 0 4px">習慣の名前</label>
    <input id="name" type="text" value="プログラミング" style="height: 48px; border-radius: 12px; border: 1.5px solid #CAD3E1; background: #FFFFFF; padding: 0 14px; font-size: 16px">
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px; background: #FFFFFF; border: 1px solid #DDE4EE; border-radius: 18px; padding: 16px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-size: 15px; font-weight: 800">きっかけを決める</div>
      <div style="font-size: 13px; color: #52607A; line-height: 1.5">記録画面のいちばん上に常に表示される。空欄でもいい。</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="trigger" style="font-size: 13px; font-weight: 700">〜したら</label>
      <input id="trigger" type="text" value="夕食を食べ終えたら" style="height: 48px; border-radius: 12px; border: 1.5px solid #CAD3E1; background: #F5F7FB; padding: 0 14px; font-size: 16px">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="action" style="font-size: 13px; font-weight: 700">〜する</label>
      <input id="action" type="text" value="PCを開いて1問解く" style="height: 48px; border-radius: 12px; border: 1.5px solid #CAD3E1; background: #F5F7FB; padding: 0 14px; font-size: 16px">
    </div>
    <div style="font-size: 12px; color: #52607A; text-align: right; font-variant-numeric: tabular-nums">各60文字まで</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; color: #52607A; font-weight: 700; padding: 0 4px">記録画面での見え方</div>
    <div style="background: #FFFFFF; border: 1px dashed #AEB9CB; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15px; font-weight: 700">
      <span>夕食を食べ終えたら</span>
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#1E3A8A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h11"></path><path d="M10 5l4 4-4 4"></path></svg>
      <span>PCを開いて1問解く</span>
    </div>
  </div>

  <div style="flex-grow: 1"></div>
  <button type="button" style="height: 48px; border-radius: 12px; border: 1.5px solid #E7C4BE; background: #FFFFFF; color: #B42318; font-size: 15px; font-weight: 700">この習慣を削除</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
