<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>週まとめ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
a{color:#0F1B33}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 940px; background: #EDF1F7; color: #0F1B33; font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif; display: flex; flex-direction: column; gap: 16px; padding: 52px 16px 32px 16px">
  <a href="Main.dc.html" style="display: flex; align-items: center; gap: 2px; min-height: 44px; width: 96px; font-size: 15px; font-weight: 600; text-decoration: none">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 7 10l5.5 5.5"></path></svg>
    今日
  </a>
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 4px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 26px; font-weight: 800">週まとめ</h1>
      <div style="font-size: 14px; color: #52607A; font-weight: 600">9月28日 – 10月4日</div>
    </div>
    <div style="display: flex; gap: 6px">
      <button type="button" aria-label="前の週" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DAE1EC; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 7 10l5.5 5.5"></path></svg>
      </button>
      <button type="button" aria-label="次の週" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #DAE1EC; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #8A96AB">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5 13 10l-5.5 5.5"></path></svg>
      </button>
    </div>
  </div>

  <div style="background: #FFFFFF; border: 1px solid #DDE4EE; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: grid; grid-template-columns: 96px repeat(7, minmax(0, 1fr)) 40px; gap: 4px; align-items: center">
      <div></div>
      <sc-for list="{{dayLabels}}" as="l" hint-placeholder-count="7">
        <div style="font-size: 11px; color: #52607A; font-weight: 700; text-align: center">{{l}}</div>
      </sc-for>
      <div></div>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <div style="display: grid; grid-template-columns: 96px repeat(7, minmax(0, 1fr)) 40px; gap: 4px; align-items: center">
        <div style="font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</div>
        <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="7">
          <div style="height: 30px; display: flex; align-items: center; justify-content: center">
            <sc-if value="{{c.isO}}" hint-placeholder-val="{{ true }}">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="#0F1B33"><circle cx="10" cy="10" r="8"></circle></svg>
            </sc-if>
            <sc-if value="{{c.isT}}" hint-placeholder-val="{{ false }}">
              <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#0F1B33" stroke-width="2.2" stroke-linejoin="round"><path d="M10 3.5 17 16H3z"></path></svg>
            </sc-if>
            <sc-if value="{{c.isX}}" hint-placeholder-val="{{ false }}">
              <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#8A96AB" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l10 10M15 5 5 15"></path></svg>
            </sc-if>
            <sc-if value="{{c.isN}}" hint-placeholder-val="{{ false }}">
              <div style="width: 14px; height: 14px; border-radius: 999px; border: 1.5px dashed #AEB9CB"></div>
            </sc-if>
          </div>
        </sc-for>
        <div style="font-size: 14px; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums">{{r.count}}/7</div>
      </div>
    </sc-for>
    <div style="display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: #52607A; font-weight: 600; border-top: 1px solid #E8EDF4; padding-top: 12px">
      <span>● できた</span><span>△ 少し</span><span>× できず</span><span>◌ 未記入</span>
    </div>
  </div>

  <div style="background: #FFFFFF; border: 1px solid #DDE4EE; border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="font-size: 15px; font-weight: 800">今週多かった邪魔</div>
    <sc-for list="{{blockers}}" as="b" hint-placeholder-count="3">
      <div style="display: grid; grid-template-columns: 64px minmax(0, 1fr) 32px; gap: 10px; align-items: center">
        <div style="font-size: 14px; font-weight: 700">{{b.tag}}</div>
        <div style="height: 10px; background: #DCE6FB; border-radius: 999px; overflow: hidden">
          <div style="height: 10px; background: #2563EB; border-radius: 999px; width: {{b.w}}"></div>
        </div>
        <div style="font-size: 14px; font-weight: 800; text-align: right; font-variant-numeric: tabular-nums">×{{b.count}}</div>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 12px; color: #52607A; font-weight: 700; padding: 0 4px">過去の週</div>
    <sc-for list="{{past}}" as="p" hint-placeholder-count="2">
      <button type="button" style="height: 52px; border-radius: 14px; border: 1px solid #DAE1EC; background: #FFFFFF; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; font-weight: 700">
        <span>{{p.range}}</span>
        <span style="display: flex; align-items: center; gap: 8px; color: #52607A; font-variant-numeric: tabular-nums">{{p.total}}
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5 13 10l-5.5 5.5"></path></svg>
        </span>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":940}}'>
class Component extends DCLogic {
  renderVals() {
    const cell = (s) => ({ isO: s === 'o', isT: s === 't', isX: s === 'x', isN: s === 'n' });
    const raw = [
      { name: '腕立て伏せ', days: ['o', 'o', 'o', 'o', 'n', 'n', 'n'] },
      { name: 'プログラミング', days: ['o', 'x', 'o', 't', 'n', 'n', 'n'] },
      { name: '読書', days: ['o', 't', 'o', 'n', 'n', 'n', 'n'] }
    ];
    const rows = raw.map((r) => ({
      name: r.name,
      cells: r.days.map(cell),
      count: r.days.filter((d) => d === 'o' || d === 't').length
    }));
    const bl = [{ tag: '疲労', count: 3 }, { tag: 'SNS', count: 2 }, { tag: '課題', count: 1 }];
    const max = 3;
    const blockers = bl.map((b) => ({ ...b, w: (b.count / max * 100) + '%' }));
    return {
      dayLabels: ['月', '火', '水', '木', '金', '土', '日'],
      rows,
      blockers,
      past: [{ range: '9月21日 – 9月27日', total: '16/21' }, { range: '9月14日 – 9月20日', total: '18/21' }]
    };
  }
}
</script>
</body>
</html>
