<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>習慣</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app" hidden>
  <header id="app-header">
    <nav id="header-nav"></nav>
    <h1 id="screen-title">習慣化トラッカー</h1>
    <div id="header-actions"></div>
  </header>
  <main id="screen"></main>

  <dialog id="add-habit-dialog">
    <form id="add-habit-form">
      <h2>習慣を追加</h2>

      <label for="habit-name">名前</label>
      <input id="habit-name" type="text" required autocomplete="off">

      <label for="habit-started-on">開始日</label>
      <input id="habit-started-on" type="date" required>

      <p id="add-habit-error" class="error" hidden></p>

      <menu>
        <button id="add-habit-cancel" type="button">キャンセル</button>
        <button type="submit">追加</button>
      </menu>
    </form>
  </dialog>

  <!-- close イベントに依存せず、ボタンのクリックで結果を決める。
       form method="dialog" は returnValue を設定して閉じるところまでは動くが、
       close イベントが発火しない環境があり、待ち続けて固まる。 -->
  <dialog id="confirm-dialog">
    <p id="confirm-message"></p>
    <menu>
      <button type="button" id="confirm-cancel">やめる</button>
      <button type="button" id="confirm-ok" class="danger">消す</button>
    </menu>
  </dialog>
</div>

<!-- 習慣カード。innerHTML を使わずに済むよう、骨組みはここに置いて複製する。
     稲妻を緑と紫で出し分けるためインライン SVG にしている。絵文字の ⚡ は
     iOS では色付き絵文字として描かれ、CSS で色を変えられない。 -->
<template id="habit-card-template">
  <article class="card">
    <button type="button" class="card-head">
      <span class="card-name"></span>
      <span class="card-today"></span>
      <span class="card-stats">
        <span class="stat stat-streak" aria-label="連続日数">
          <svg class="bolt" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 L4 14 h6 l-1 8 9-12 h-6 z"/></svg>
          <span class="stat-value"></span>
        </span>
        <span class="stat stat-setback" aria-label="挫折回数">
          <svg class="bolt" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 L4 14 h6 l-1 8 9-12 h-6 z"/></svg>
          <span class="stat-value"></span>
        </span>
      </span>
    </button>
  </article>
</template>

<!-- カードを開いたときの中身。達成度を選ぶまでテキスト欄は無効にする
     （rating は必須項目なので、達成度が決まるまでログを作れない）。 -->
<template id="card-body-template">
  <div class="card-body">
    <div class="ratings" role="group" aria-label="達成度">
      <button type="button" class="rating" data-rating="2">○</button>
      <button type="button" class="rating" data-rating="1">△</button>
      <button type="button" class="rating" data-rating="0">×</button>
    </div>
    <p class="recorded-at"></p>

    <label class="field-label">
      <span class="field-name">今日の一行動</span>
      <textarea class="field" data-field="action" rows="2"></textarea>
    </label>
    <label class="field-label">
      <span class="field-name">今日邪魔したもの</span>
      <textarea class="field" data-field="blocker" rows="2"></textarea>
    </label>
    <label class="field-label">
      <span class="field-name">明日への修正</span>
      <textarea class="field" data-field="fix" rows="2"></textarea>
    </label>

    <p class="saved-note" hidden>保存しました</p>
    <a class="week-link">週まとめを見る</a>
  </div>
</template>

<p id="boot-status">読み込み中…</p>

<script>
  // app.js が一度も動かなかった場合に「読み込み中…」のまま黙って止まらないようにする。
  // file:// で開くと ES Modules は CORS で弾かれ、エラーも画面に出ないまま何も起きない。
  setTimeout(function () {
    var boot = document.getElementById('boot-status');
    if (boot.dataset.started === '1') return;
    boot.className = 'error';
    boot.textContent = location.protocol === 'file:'
      ? 'file:// では ES Modules を読み込めません。HTTP 経由で開いてください。'
      : 'アプリを起動できませんでした。ブラウザのコンソールを確認してください。';
  }, 2000);
</script>
<script type="module" src="js/app.js"></script>

</body>
</html>
