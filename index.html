<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- ステータスバーの帯を地の色に合わせる。メディア指定を付けないと
     どちらかのテーマで帯だけ浮く。 -->
<meta name="theme-color" content="#EDF1F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
<title>習慣</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<!-- iOS はホーム画面のアイコンに manifest ではなくこれを使う -->
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- status-bar-style は固定色しか取れず、ライトでも黒帯になる。
     theme-color のメディア指定に任せるため指定しない。 -->
<meta name="apple-mobile-web-app-title" content="習慣">

<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app" hidden>
  <!-- 中身は画面ごとに違うので、各画面が組み立てる -->
  <header id="app-header"></header>
  <main id="screen"></main>

  <!-- 読み込み用。見えないが display:none にはしない。
       hidden な要素は click() で選択画面が開かない環境がある。 -->
  <input id="backup-file" type="file" accept="application/json,.json" class="visually-hidden">

  <dialog id="add-habit-dialog">
    <form id="add-habit-form">
      <h2>習慣を追加</h2>

      <label for="habit-name">名前</label>
      <input id="habit-name" type="text" required autocomplete="off">

      <label for="habit-started-on">開始日</label>
      <input id="habit-started-on" type="date" required>

      <p id="add-habit-error" class="error" hidden></p>

      <menu>
        <button id="add-habit-cancel" type="button">キャンセル</button>
        <button type="submit">追加</button>
      </menu>
    </form>
  </dialog>

  <dialog id="edit-habit-dialog">
    <form id="edit-habit-form">
      <h2>習慣を編集</h2>

      <label for="edit-habit-name">名前</label>
      <input id="edit-habit-name" type="text" required autocomplete="off">

      <label for="edit-habit-started-on">開始日</label>
      <input id="edit-habit-started-on" type="date" required>

      <div>
        <p class="order-row">
          <span>並び順</span>
          <span id="edit-habit-position"></span>
        </p>
        <div class="order-buttons">
          <button type="button" id="edit-habit-up">上へ</button>
          <button type="button" id="edit-habit-down">下へ</button>
        </div>
      </div>

      <p id="edit-habit-error" class="error" hidden></p>

      <!-- 並べ替え・休止・削除は押した時点で反映する。保存ボタンの対象は
           名前と開始日だけ。 -->
      <div class="edit-actions">
        <button type="button" id="edit-habit-delete" class="danger">この習慣を削除</button>
      </div>

      <menu>
        <button type="button" id="edit-habit-cancel">キャンセル</button>
        <button type="submit">保存</button>
      </menu>
    </form>
  </dialog>

  <!-- close イベントに依存せず、ボタンのクリックで結果を決める。
       form method="dialog" は returnValue を設定して閉じるところまでは動くが、
       close イベントが発火しない環境があり、待ち続けて固まる。 -->
  <dialog id="confirm-dialog">
    <p id="confirm-message"></p>
    <menu>
      <button type="button" id="confirm-cancel">やめる</button>
      <button type="button" id="confirm-ok" class="danger">消す</button>
    </menu>
  </dialog>
</div>

<!-- 習慣カード。innerHTML を使わずに済むよう、骨組みはここに置いて複製する。
     稲妻とマークはインライン SVG。絵文字は iOS では色付き絵文字として描かれ、
     CSS で色を変えられない。 -->
<template id="habit-card-template">
  <article class="card">
    <!-- 左スワイプで表面が滑り、下から削除ボタンが出る -->
    <div class="card-delete">
      <button type="button" class="trash-button" aria-label="この習慣を削除">
        <svg class="trash" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 3h6l1 2h4v2H4V5h4l1-2z"/>
          <path d="M6 9h12l-1 12H7L6 9z"/>
        </svg>
      </button>
    </div>
    <div class="card-surface">
      <div class="card-top">
        <a class="card-name"></a>
        <span class="card-comeback"></span>
      </div>

      <div class="card-main"></div>

      <div class="card-gauge">
        <div class="gauge-label"></div>
        <div class="gauge-track"><div class="gauge-fill"></div></div>
      </div>

      <div class="ratings" role="group" aria-label="達成度">
        <button type="button" class="rating" data-rating="2" aria-label="できた">
          <svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="10" cy="10" r="7"></circle></svg>
        </button>
        <button type="button" class="rating" data-rating="1" aria-label="少しできた">
          <svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M10 3.5 17 16H3z"></path></svg>
        </button>
        <button type="button" class="rating" data-rating="0" aria-label="できなかった">
          <svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 5l10 10M15 5 5 15"></path></svg>
        </button>
      </div>
    </div>
  </article>
</template>

<!-- カードのメイン表示。状態ごとに 1 つだけ使う。 -->
<template id="card-main-streak-template">
  <div class="main-streak">
    <svg class="bolt" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 L4 14 h6 l-1 8 9-12 h-6 z"/></svg>
    <span class="main-number"></span>
    <span class="main-unit">日連続</span>
  </div>
</template>

<template id="card-main-week-template">
  <div class="main-week">
    <div class="week-headline">
      <span class="main-unit">今週</span>
      <span class="main-number"></span>
      <span class="main-of">/ 7</span>
      <span class="main-sub"></span>
    </div>
    <div class="week-dots"></div>
  </div>
</template>

<template id="card-main-done-template">
  <div class="main-done">
    <span class="done-badge">66日達成</span>
    <span class="done-streak">
      <span class="main-number"></span>
      <span class="main-unit">日連続</span>
    </span>
  </div>
</template>

<template id="week-dot-template">
  <div class="week-day">
    <span class="dot"></span>
    <span class="week-day-label"></span>
  </div>
</template>

<!-- 記録フォーム。ホームの「今日の記録」と、週まとめの「過去の日の記録・修正」で
     同じものを使う。達成度を選ぶまでテキスト欄は無効にする（rating は必須項目
     なので、達成度が決まるまでログを作れない）。
     項目名は対象日が今日かどうかで入れ替えるので、ここでは空にしておく。 -->
<template id="record-form-template">
  <div class="record-form">
    <div class="ratings" role="group" aria-label="達成度">
      <button type="button" class="rating" data-rating="2">○</button>
      <button type="button" class="rating" data-rating="1">△</button>
      <button type="button" class="rating" data-rating="0">×</button>
    </div>
    <p class="recorded-at"></p>

    <label class="field-label">
      <span class="field-name" data-label="action"></span>
      <textarea class="field" data-field="action" rows="2"></textarea>
    </label>
    <label class="field-label">
      <span class="field-name" data-label="blockerNote"></span>
      <textarea class="field" data-field="blockerNote" rows="2"></textarea>
    </label>
    <label class="field-label">
      <span class="field-name" data-label="fix"></span>
      <textarea class="field" data-field="fix" rows="2"></textarea>
    </label>

    <p class="saved-note" hidden>保存しました</p>
  </div>
</template>

<p id="boot-status">読み込み中…</p>

<script>
  // app.js が一度も動かなかった場合に「読み込み中…」のまま黙って止まらないようにする。
  // iPhone にはコンソールが無いので、何が起きたかを画面に出す。
  (function () {
    var boot = document.getElementById('boot-status');
    var problems = [];

    function note(message) {
      if (message && problems.indexOf(message) === -1) problems.push(message);
    }

    // 読み込めなかったファイルと、実行時のエラーの両方を拾う。
    window.addEventListener('error', function (event) {
      if (event.target && event.target.src) note('読み込めません: ' + event.target.src);
      else note(event.message);
    }, true);

    window.addEventListener('unhandledrejection', function (event) {
      var reason = event.reason;
      note(reason && reason.message ? reason.message : String(reason));
    });

    setTimeout(function () {
      if (boot.dataset.started === '1') return;
      boot.className = 'error';
      boot.textContent = (location.protocol === 'file:'
        ? 'file:// では ES Modules を読み込めません。HTTP 経由で開いてください。'
        : 'アプリを起動できませんでした。')
        + (problems.length ? '\n\n' + problems.join('\n') : '')
        + '\n\n電波の良い場所でアプリを完全に終了し、開き直すと直ることがあります。'
        + 'サイトデータの削除はしないでください（記録が消えます）。';
    }, 2000);
  })();
</script>
<script type="module" src="js/app.js"></script>

</body>
</html>
