<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>習慣</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app" hidden>
  <header id="app-header">
    <nav id="header-nav"></nav>
    <h1 id="screen-title">習慣</h1>
    <div id="header-actions"></div>
  </header>
  <main id="screen"></main>
</div>

<p id="boot-status">読み込み中…</p>

<script>
  // app.js が一度も動かなかった場合に「読み込み中…」のまま黙って止まらないようにする。
  // file:// で開くと ES Modules は CORS で弾かれ、エラーも画面に出ないまま何も起きない。
  setTimeout(function () {
    var boot = document.getElementById('boot-status');
    if (boot.dataset.started === '1') return;
    boot.className = 'error';
    boot.textContent = location.protocol === 'file:'
      ? 'file:// では ES Modules を読み込めません。HTTP 経由で開いてください。'
      : 'アプリを起動できませんでした。ブラウザのコンソールを確認してください。';
  }, 2000);
</script>
<script type="module" src="js/app.js"></script>

</body>
</html>
